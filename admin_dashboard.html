<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
    <title>관리자 메인 | 월촌캠핑장</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="admin-sidebar"></aside>

        <main class="admin-main">
            <div class="admin-header">
                <h1>관리자 메인</h1>
                <p>월촌캠핑장 홈페이지의 예약, 공지사항, 문의글, FAQ를 관리합니다.</p>
            </div>

            <section class="admin-card-grid dashboard-card-grid">
                <div class="admin-card">
                    <h3>전체 예약</h3>
                    <div class="count" id="reservation-total-count">0</div>
                </div>

                <div class="admin-card">
                    <h3>결제대기</h3>
                    <div class="count" id="reservation-waiting-count">0</div>
                </div>

                <div class="admin-card">
                    <h3>예약완료</h3>
                    <div class="count" id="reservation-complete-count">0</div>
                </div>

                <div class="admin-card">
                    <h3>문의글</h3>
                    <div class="count" id="qna-count">0</div>
                </div>
            </section>

            <section class="admin-panel">
                <h2>관리 메뉴</h2>

                <div class="admin-link-grid dashboard-link-grid">
                    <a href="admin_reservation.html" class="admin-link-card">
                        <strong>예약 관리</strong>
                        <span>예약 확인, 결제대기/예약완료 상태 관리</span>
                    </a>

                    <a href="admin_notice.html" class="admin-link-card">
                        <strong>공지사항 관리</strong>
                        <span>공지 등록, 삭제, 필독 공지 설정</span>
                    </a>

                    <a href="admin_qna.html" class="admin-link-card">
                        <strong>문의/Q&A 관리</strong>
                        <span>고객 문의 확인 및 관리자 답변 작성</span>
                    </a>

                    <a href="admin_faq.html" class="admin-link-card">
                        <strong>FAQ 관리</strong>
                        <span>자주 묻는 질문 등록 및 삭제</span>
                    </a>
                </div>
            </section>

            <section class="admin-panel">
                <div class="admin-panel-title-row">
                    <h2>최근 예약</h2>
                    <a href="admin_reservation.html" class="btn btn-outline">예약 전체 보기</a>
                </div>

                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th style="width:90px;">상태</th>
                                <th style="width:120px;">예약자</th>
                                <th style="width:140px;">연락처</th>
                                <th>날짜</th>
                                <th style="width:90px;">구역</th>
                                <th style="width:110px;">금액</th>
                            </tr>
                        </thead>
                        <tbody id="recent-reservation-list"></tbody>
                    </table>
                </div>
            </section>

            <section class="admin-panel">
                <h2>콘텐츠 현황</h2>

                <div class="admin-card-grid dashboard-small-grid">
                    <div class="admin-card">
                        <h3>공지사항</h3>
                        <div class="count small" id="notice-count">0</div>
                    </div>

                    <div class="admin-card">
                        <h3>FAQ</h3>
                        <div class="count small" id="faq-count">0</div>
                    </div>

                    <div class="admin-card">
                        <h3>전체 문의글</h3>
                        <div class="count small" id="qna-total-count">0</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Supabase 클라이언트와 관리자 인증을 먼저 준비합니다. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/admin-auth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const recentList = document.getElementById('recent-reservation-list');

            try {
                if (!window.supabaseClient) {
                    throw new Error('Supabase 연결 설정을 찾을 수 없습니다.');
                }

                if (!window.AdminAuth || typeof window.AdminAuth.requireAdmin !== 'function') {
                    throw new Error('관리자 인증 모듈을 찾을 수 없습니다.');
                }

                // 로그인 여부뿐 아니라 관리자 권한까지 확인합니다.
                const isAdmin = await window.AdminAuth.requireAdmin();

                if (!isAdmin) {
                    return;
                }

                await loadDashboard();
            } catch (error) {
                console.error('관리자 대시보드 초기화 오류:', error);

                recentList.innerHTML = `
                    <tr>
                        <td colspan="6">대시보드 정보를 불러오지 못했습니다.</td>
                    </tr>
                `;
            }
        });

        async function loadDashboard() {
            const client = window.supabaseClient;

            const [
                totalResult,
                waitingResult,
                completeResult,
                noticeResult,
                qnaResult,
                faqResult,
                recentResult
            ] = await Promise.all([
                client
                    .from('reservations')
                    .select('id', { count: 'exact', head: true }),

                client
                    .from('reservations')
                    .select('id', { count: 'exact', head: true })
                    .eq('status', '결제대기'),

                client
                    .from('reservations')
                    .select('id', { count: 'exact', head: true })
                    .eq('status', '예약완료'),

                client
                    .from('notices')
                    .select('id', { count: 'exact', head: true }),

                client
                    .from('qna_posts')
                    .select('id', { count: 'exact', head: true }),

                client
                    .from('faqs')
                    .select('id', { count: 'exact', head: true }),

                client
                    .from('reservations')
                    .select('id, name, phone, reservation_date, site, price, status, created_at')
                    .order('created_at', { ascending: false })
                    .limit(5)
            ]);

            const results = [
                totalResult,
                waitingResult,
                completeResult,
                noticeResult,
                qnaResult,
                faqResult,
                recentResult
            ];

            const failedResult = results.find(result => result.error);

            if (failedResult) {
                throw failedResult.error;
            }

            setText('reservation-total-count', totalResult.count || 0);
            setText('reservation-waiting-count', waitingResult.count || 0);
            setText('reservation-complete-count', completeResult.count || 0);
            setText('notice-count', noticeResult.count || 0);
            setText('qna-count', qnaResult.count || 0);
            setText('qna-total-count', qnaResult.count || 0);
            setText('faq-count', faqResult.count || 0);

            renderRecentReservations(recentResult.data || []);
        }

        function renderRecentReservations(reservations) {
            const target = document.getElementById('recent-reservation-list');

            if (!reservations.length) {
                target.innerHTML = `
                    <tr>
                        <td colspan="6">최근 예약 내역이 없습니다.</td>
                    </tr>
                `;
                return;
            }

            target.innerHTML = reservations.map(reservation => `
                <tr>
                    <td>
                        <span class="admin-status ${getStatusClass(reservation.status)}">
                            ${escapeHtml(reservation.status || '결제대기')}
                        </span>
                    </td>
                    <td>${escapeHtml(reservation.name)}</td>
                    <td>${escapeHtml(reservation.phone)}</td>
                    <td class="left">${escapeHtml(reservation.reservation_date)}</td>
                    <td>${escapeHtml(reservation.site)}</td>
                    <td>${formatPrice(reservation.price)}</td>
                </tr>
            `).join('');
        }

        function setText(id, value) {
            const target = document.getElementById(id);

            if (target) {
                target.innerText = String(value);
            }
        }

        function getStatusClass(status) {
            if (status === '예약완료') return 'complete';
            if (status === '취소됨' || status === '자동취소') return 'cancel';
            return 'waiting';
        }

        function formatPrice(price) {
            const numericPrice = Number(price);

            if (Number.isFinite(numericPrice)) {
                return `${numericPrice.toLocaleString('ko-KR')}원`;
            }

            return escapeHtml(price || '-');
        }

        function escapeHtml(text) {
            return String(text ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }
    </script>

    <script src="js/admin-layout.js"></script>
</body>

</html>
